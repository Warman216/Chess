name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create .env file
        run: |
          # If the app needs a Gemini API key at build time, add it as a
          # repo secret named GEMINI_API_KEY (Settings > Secrets and variables
          # > Actions), then this line writes it into a .env file the app expects.
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

      - name: Grant execute permission for gradlew
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Fix known KSP 2.3.5 CI bug
        run: |
          # KSP 2.3.5 throws a NullPointerException in headless/CI environments
          # (google/ksp#2763). Bump it to 2.3.8+, which is confirmed compatible
          # with Kotlin 2.2.x and newer.
          sed -i 's/googleDevtoolsKsp = "2.3.5"/googleDevtoolsKsp = "2.3.8"/' gradle/libs.versions.toml

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chess-debug-apk
          path: app/build/outputs/apk/debug/*.apk
